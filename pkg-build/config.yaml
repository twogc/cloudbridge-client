# CloudBridge Client configuration template
# Canonical ports: docs/CONTRACT_CLIENT_RELAY.md

relay:
  host: "localhost"
  port: 5550
  ports:
    http_api: 9090
    https_api: 5553
    p2p_api: 5552
    quic: 5553
    quic_main: 9090
    grpc: 8444
    stun: 19302
    masque: 8443
    enhanced_quic: 9092
    turn: 3478
    derp: 3479
  tls:
    enabled: true
    min_version: "1.3"
    verify_cert: false
    server_name: "localhost"

auth:
  type: "jwt"
  token: "YOUR_JWT_TOKEN_HERE"
  secret: "YOUR_JWT_SECRET_HERE"
  skip_validation: false

# OIDC (Zitadel) — preferred for production with current relay
# auth:
#   type: oidc
#   oidc:
#     issuer_url: "https://your-zitadel.example"
#     audience: "cloudbridge-client"

api:
  base_url: "https://localhost:5552"
  p2p_api_url: "https://localhost:5552"
  heartbeat_url: "https://localhost:5552"
  insecure_skip_verify: true
  timeout: 30s

ice:
  stun_servers:
    - "localhost:19302"
    - "stun.l.google.com:19302"
  turn_servers: []
  derp_servers: []

websocket:
  enabled: true
  endpoint: "wss://localhost:5552/ws"

wireguard:
  enabled: true
  interface_name: "wg-cloudbridge"
  port: 51820
  mtu: 1420

logging:
  level: "info"
  format: "json"
  output: "stdout"

metrics:
  enabled: true
  prometheus_port: 9091
